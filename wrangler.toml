name = "fakegps-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "R2"
bucket_name = "fakegps-releases"

# custom_domain 路由 (www.sixzjd.sbs / sixzjd.sbs) 已在 CF Dashboard 配置并持久生效，
# 无需在 TOML 中声明（声明反而因 token 缺 domains/records 权限导致 deploy 报错）。
